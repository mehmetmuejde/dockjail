[package]
name = "dockjail"
version = "0.1.3"
edition = "2024"
license = "MIT"
authors = ["Mehmet Müjde <freelancer@mehmetmuejde.com>"]

[dependencies]
clap = { version = "4", features = ["derive"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
